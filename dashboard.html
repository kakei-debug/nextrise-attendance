<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダッシュボード | ネクストライズ株式会社 勤怠管理システム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dash-page">
  <header class="dash-header">
    <div class="dash-brand">
      <img src="assets/logo.png" alt="NEXTRISE" class="brand-icon">
      <span class="brand-sub">ネクストライズ株式会社</span>
    </div>
    <div class="dash-user">
      <span id="user-name">-</span>
      <span id="user-dept" class="user-dept"></span>
      <button id="logout-btn" class="btn-ghost">ログアウト</button>
    </div>
  </header>

  <main class="dash-body">
    <div class="clock-card">
      <div>
        <div class="clock-date" id="clock-date">-</div>
        <div class="clock-time" id="clock-time">--:--:--</div>
        <div class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text">確認中...</span></div>
      </div>
      <div class="punch-btns">
        <button id="punch-in" class="btn-in" disabled>出勤</button>
        <button id="punch-out" class="btn-out" disabled>退勤</button>
      </div>
    </div>

    <div class="hist-card">
      <h4>直近の勤怠履歴</h4>
      <table>
        <thead><tr><th>日付</th><th>出勤</th><th>退勤</th></tr></thead>
        <tbody id="hist-body">
          <tr><td colspan="3" class="hist-empty">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
